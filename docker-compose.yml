version: "3.8"

services:
  user-service:
    build: ./services/user-service
    ports:
      - "5001:5001"
    depends_on:
      user-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_USER: admin
      DB_PASSWORD: admin
      DB_HOST: user-db
      DB_PORT: 5432
      DB_NAME: userdb
    networks:
      - app-network

  product-service:
    build: ./services/product-service
    ports:
      - "5002:5002"
    depends_on:
      product-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_USER: admin
      DB_PASSWORD: admin
      DB_HOST: product-db
      DB_PORT: 5432
      DB_NAME: productdb
    networks:
      - app-network

  user-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: userdb
    ports:
      - "5433:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d userdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  product-db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: productdb
    ports:
      - "5434:5432"
    volumes:
      - product_pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d productdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    image: redis:latest
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./services/frontend
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    networks:
      - app-network
    depends_on:
      - user-service
      - product-service

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app-network
    depends_on:
      - user-service
      - product-service


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    ports:
      - "3001:3000"
    networks:
      - app-network
    depends_on:
      - prometheus

  # ──────────────────────────────────────
  # Exporters
  # ──────────────────────────────────────

  user-db-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin@user-db:5432/userdb?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - app-network
    depends_on:
      - user-db

  product-db-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin@product-db:5432/productdb?sslmode=disable"
    ports:
      - "9188:9187"
    networks:
      - app-network
    depends_on:
      - product-db

  redis-exporter:
    image: oliver006/redis_exporter
    ports:
      - "9121:9121"
    networks:
      - app-network
    depends_on:
      - redis

  node-exporter:
    image: prom/node-exporter
    container_name: node_exporter
    ports:
      - "9100:9100"
    networks:
      - app-network

volumes:
  user_pgdata:
  product_pgdata:

networks:
  app-network:
    driver: bridge
