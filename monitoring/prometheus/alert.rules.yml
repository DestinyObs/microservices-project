groups:
  - name: service_alerts
    rules:
      - alert: UserServiceDown
        expr: up{job="user-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "User service is down"
          description: "User service has been down for more than 30 seconds."

      - alert: ProductServiceDown
        expr: up{job="product-service"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Product service is down"
          description: "Product service has been down for more than 30 seconds."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Redis is not reachable"
          description: "Redis instance is down or unreachable."

      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is over 85% for more than 2 minutes."

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "More than 90% of memory used for over 2 minutes."

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} > 0.9
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage detected"
          description: "More than 90% of disk is full on the root mount."

  - name: db_alerts
    rules:
      - alert: PostgresDown
        expr: up{job="postgres-db"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres Exporter is down"
          description: "Postgres Exporter is not responding"
