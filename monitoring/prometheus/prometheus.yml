global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:5001']

  - job_name: 'product-service'
    static_configs:
      - targets: ['product-service:5002']

  - job_name: 'postgres-db'
    static_configs:
      - targets: ['user-db-exporter:9187', 'product-db-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
